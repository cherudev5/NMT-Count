<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#374151">
<link rel="manifest" href="manifest.json">
<title>Street Survey Counter</title>
<style>
  :root{--bg:#f5f5f6;--panel:#e8ebef;--btn:#6b7280;--btn-active:#374151;--text:#1f2937;--red:#dc3545;--green:#198754;--blue:#1d4ed8;--amber:#b45309}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif;padding:12px 10px 90px}
  h1{text-align:center;font-size:28px;margin:12px 0 12px}
  .hide{display:none!important}
  #tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;height:40px;border:0;border-radius:6px;background:var(--panel);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
  .tab.on{background:var(--btn-active);color:#fff}

  /* GPS bar with lock button */
  #gps{background:var(--panel);border-radius:6px;font-size:13px;padding:8px 10px;margin-bottom:10px;color:#4b5563;
       display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
  #gpsText{text-align:center;flex:1 1 auto;min-width:0}
  #gps.ok #gpsText{color:var(--green)}
  #gps.bad #gpsText{color:var(--amber)}
  #lockBtn{background:var(--btn-active);color:#fff;border:0;border-radius:6px;height:32px;padding:0 12px;
           font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:.3px}
  #lockBtn:active{transform:scale(.97)}
  #lockBtn.locked{background:var(--green)}
  #lockBtn.warn{background:var(--amber)}
  #savedText{flex-basis:100%;text-align:center;font-size:12px;color:#4b5563;margin-top:2px}

  #metaLine{text-align:center;font-size:12px;color:#6b7280;margin-bottom:10px}
  #timer{background:var(--panel);border-radius:6px;text-align:center;font-size:22px;font-weight:600;padding:12px 14px;margin-bottom:8px}
  .row{display:grid;grid-template-columns:62px 1fr 1fr;gap:6px;margin-bottom:10px}
  .icon{background:var(--panel);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#374151;grid-row:span 2;padding:2px}
  .icon svg{width:30px;height:30px}
  .iname{font-size:10px;font-weight:600;line-height:1.1;text-align:center}
  .btn{background:var(--btn);color:#fff;border:0;border-radius:6px;height:44px;font-size:17px;font-weight:600;cursor:pointer;touch-action:manipulation}
  .btn:active{background:var(--btn-active);transform:scale(.97)}
  .count{background:#fafafa;text-align:center;font-weight:700;font-size:13px;padding:3px 0;border-radius:4px}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px;background:var(--bg);display:flex;gap:8px}
  #bar button{border:0;border-radius:6px;color:#fff;font-size:16px;height:44px}
  #end{background:var(--btn);flex:1;font-size:14px!important;opacity:.85}
  #undo{background:var(--btn);width:90px;cursor:pointer}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input,select{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:6px;padding:0 10px;font-size:16px;background:#fff;user-select:text}
  #start{width:100%;margin-top:20px;height:48px;border:0;border-radius:6px;background:var(--green);color:#fff;font-size:17px;cursor:pointer}
  #allBtns{display:flex;gap:8px;margin-bottom:12px}
  #allBtns button{flex:1;height:44px;border:0;border-radius:6px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .fcard{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .fname{font-weight:700;font-size:14px;word-break:break-all;user-select:text}
  .fmeta{font-size:12px;color:#6b7280;margin:3px 0 8px}
  .fbtns{display:flex;gap:6px}
  .fbtns button{flex:1;height:40px;border:0;border-radius:6px;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
  .b-dl{background:var(--btn)}
  .b-up{background:var(--green)}
  .b-up:disabled{background:#9ca3af;opacity:.7;cursor:not-allowed}
  .b-del{background:var(--red);flex:0 0 66px!important}
  #upBar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  #upBar label{flex:1;margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  #upBar input,.fhead input{width:22px;height:22px;flex:0 0 22px}
  #upBtn{flex:1;height:44px;border:0;border-radius:6px;background:var(--green);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  #upBtn:disabled{opacity:.45;cursor:not-allowed}
  .fhead{display:flex;gap:10px;align-items:flex-start}
  .fhead input{margin-top:1px}
  .st-ok{color:var(--green);font-weight:600} .st-no{color:var(--amber);font-weight:600}
  .empty{text-align:center;color:#6b7280;margin:40px 10px;font-size:14px}
  #overlay{position:fixed;inset:0;background:rgba(17,24,39,.85);display:none;align-items:center;justify-content:center;z-index:10}
  #overlay .card{background:#fff;border-radius:10px;padding:26px 30px;text-align:center;font-size:18px;font-weight:600;max-width:320px;word-break:break-word}
  #ovIcon{font-size:38px;margin-bottom:10px}
  #toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;display:none;z-index:11;max-width:90%;text-align:center}
</style>
</head>
<body>
  <div id="storeWarn" class="hide" style="background:#fff3cd;color:#664d03;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px">⚠ This browser is not keeping data between page loads. Download each Excel file straight after every session.</div>
  <h1 id="title">Data entry</h1>
  <div id="tabs">
    <button class="tab on" id="tabCount">Count</button>
    <button class="tab" id="tabFiles">Files <span id="badge"></span></button>
  </div>

  <!-- GPS bar with lock button -->
  <div id="gps">
    <span id="gpsText">📍 Locating…</span>
    <button id="lockBtn" type="button">Lock location</button>
    <div id="savedText"></div>
  </div>

  <div id="setupView">
    <label for="f_point_code">Point code *</label><input id="f_point_code" autocomplete="off">
    <label for="f_weather">Weather *</label>
    <select id="f_weather">
      <option value="">Select…</option>
      <option>Sunny</option><option>Cloudy</option><option>Overcast</option>
      <option>Light rain</option><option>Heavy rain</option><option>Windy</option><option>Hot</option>
    </select>
    <label for="f_enumerator_name">Enumerator name *</label><input id="f_enumerator_name" autocomplete="off">
    <label for="f_device_id">Device ID</label><input id="f_device_id" autocomplete="off">
    <button id="start">Start Counting</button>
  </div>

  <div id="countView" class="hide">
    <div id="metaLine"></div>
    <div id="timer">00:15:00</div>
    <div id="rows"></div>
    <div id="bar">
      <button id="undo">Undo</button>
      <button id="end" disabled>Ends automatically after 15 min</button>
    </div>
  </div>

  <div id="filesView" class="hide">
    <div id="allBtns">
      <button id="dlAll" style="background:var(--btn)">Download all (1 Excel file)</button>
      <button id="upAll" class="hide" style="background:var(--green)">Upload all pending</button>
    </div>
    <div id="upBar" class="hide">
      <label><input type="checkbox" id="selAll"> Select all not uploaded</label>
      <button id="upBtn" disabled>Upload selected</button>
    </div>
    <div id="fileList"></div>
  </div>

  <div id="overlay"><div class="card"><div id="ovIcon"></div><span id="ovText"></span></div></div>
  <div id="toast"></div>

const ICON_FILES = {
  'Cyclist':         'icons/cycling.svg',
  'Woman':           'icons/woman-walking-facing-right.svg',
  'Man':             'icons/man-walking-facing-right.svg',
  'Child':           'icons/child.svg',
  'Wheelchair user': 'icons/wheelchair.svg',
  'Hand cart':       'icons/human-trolley.svg'
};
const ICON_CACHE = {};
function iconFor(cat){ return ICON_CACHE[cat] || ICONS[cat]; }
function cleanSvg(t){ return t.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son\w+="[^"]*"/gi, ''); }
function loadIcons(){
  if (typeof fetch !== 'function') return;
  Promise.all(CATEGORIES.map(c =>
    fetch(ICON_FILES[c]).then(r => r.ok ? r.text() : Promise.reject())
      .then(txt => { if (/<svg/i.test(txt)) ICON_CACHE[c] = cleanSvg(txt); })
      .catch(() => {})
  )).then(() => { if (Object.keys(ICON_CACHE).length) buildRows(); });
}

/* ============================================================
   UPLOAD SETTINGS
   ============================================================ */
const CONFIG = {
  uploadUrl: 'https://script.google.com/macros/s/AKfycbyxD5q7HiKZsJzF7zZ0Fg9wFJhu79mZUHci4Ibl93DqtVezk59iEG3kU32HTER2kRBa8A/exec',
  apiKey: '',
  uploadTapLog: false
};

/* Recommended GPS accuracy target (metres) */
const RECOMMENDED_ACC = 10;

const DURATION = 15 * 60 * 1000;
const KEY  = 'streetCounterState',
      DKEY = 'streetCounterDefaults',
      SKEY = 'streetCounterSessions',
      NKEY = 'streetCounterNext',
      UKEY = 'streetCounterUploadedUids';
const XLSX_TYPE = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

let counts = {}, events = [], startTime = null, tick = null, saving = false;
let meta = null, geo = null, lastFix = null, sessions = [], view = 'count';
/* lockedFix lives only in memory — it is cleared when a count ends and never
   survives a page reload. Perfect for enumerators moving between points. */
let lockedFix = null;
let uploadedUids = new Set(getJSON(UKEY, []));
const selected = new Set();
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

/* ---------- storage helpers ---------- */
function getJSON(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function setJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function saveSessions(){ const ok = setJSON(SKEY, sessions); updateSaved(); return ok; }
function saveUploadedUids(){ setJSON(UKEY, Array.from(uploadedUids)); }
function isUploaded(r){ return !!(r && (r.uploaded || uploadedUids.has(r.uid))); }
function nextNo(){ return getJSON(NKEY, sessions.length + 1); }
function makeUid(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
/* NOTE: lockedFix is intentionally NOT persisted — it is per-count only. */
function persist(){ setJSON(KEY, {counts, events, startTime, geo, meta}); }
function clearState(){ try{ localStorage.removeItem(KEY); }catch(e){} }

/* ---------- start-up ---------- */
sessions = getJSON(SKEY, []);
sessions.forEach(r => { if (r.uploaded && r.uid) uploadedUids.add(r.uid); });
saveUploadedUids();

try{ localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }catch(e){ $('storeWarn').classList.remove('hide'); }
const st = getJSON(KEY, null);
if (st){
  counts    = st.counts    || {};
  events    = st.events    || [];
  startTime = st.startTime;
  geo       = st.geo       || null;
  meta      = st.meta      || null;
  /* lockedFix deliberately NOT restored — every fresh load starts unlocked */
}
buildRows(); setupForm(); updateSaved(); startGps();
if (meta) showCount(); else layout();
if (startTime) runTimer();

$('undo').onclick = undo;
$('tabCount').onclick = () => showView('count');
$('tabFiles').onclick = () => showView('files');
$('upBtn').onclick = uploadSelected;
$('lockBtn').onclick = toggleLock;
$('selAll').onchange = e => {
  selected.clear();
  if (e.target.checked) sessions.filter(r => !isUploaded(r)).forEach(r => selected.add(r.uid));
  renderFiles();
};
$('dlAll').onclick = () => downloadBlob(allName(), toBlob(allWorkbook()));
$('upAll').onclick = () => uploadRecs(sessions.filter(r => !isUploaded(r)));
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- views ---------- */
function showView(v){
  if (v === 'files' && startTime){ toast('Finish counting first'); return; }
  view = v; layout();
  if (v === 'files') renderFiles();
}
function layout(){
  const files = view === 'files';
  $('setupView').classList.toggle('hide', files || !!meta);
  $('countView').classList.toggle('hide', files || !meta);
  $('filesView').classList.toggle('hide', !files);
  $('tabCount').classList.toggle('on', !files);
  $('tabFiles').classList.toggle('on', files);
  $('title').textContent = files ? 'Files' : 'Data entry';
}
function updateSaved(){
  const n = sessions.length;
  const pending = sessions.filter(r => !isUploaded(r)).length;
  $('savedText').textContent = n + ' session' + (n === 1 ? '' : 's') + ' saved on this phone' +
    (CONFIG.uploadUrl ? ' · ' + pending + ' not uploaded' : ' · works offline');
  $('badge').textContent = (CONFIG.uploadUrl ? pending : n) ? '(' + (CONFIG.uploadUrl ? pending : n) + ')' : '';
}

/* ---------- setup form ---------- */
function setupForm(){
  const d = getJSON(DKEY, {});
  if (!d.device_id) d.device_id = 'DEV-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  ['point_code','enumerator_name','device_id'].forEach(k => $('f_' + k).value = d[k] || '');
  $('start').onclick = () => {
    const m = {};
    ['point_code','weather','enumerator_name','device_id'].forEach(k => m[k] = $('f_' + k).value.trim());
    const missing = ['point_code','weather','enumerator_name'].filter(k => !m[k]);
    if (missing.length){ toast('Please fill: ' + missing.map(k => k.replace(/_/g,' ')).join(', ')); return; }

    // If the user hasn't explicitly locked a fix yet, offer to lock now.
    if (!lockedFix){
      const f = lastFix;
      if (!f){
        if (!confirm('No GPS fix yet. Start counting anyway?')) return;
      } else if (f.acc > RECOMMENDED_ACC){
        if (!confirm('GPS accuracy is ±' + f.acc + ' m (recommended ≤ ' + RECOMMENDED_ACC + ' m).\n\nLock the current location and start anyway?')) return;
        lockedFix = f;
      } else {
        if (!confirm('Lock current location (±' + f.acc + ' m) and start counting?')) return;
        lockedFix = f;
      }
    }

    if (!m.device_id) m.device_id = d.device_id;
    meta = m;
    setJSON(DKEY, {point_code: m.point_code, enumerator_name: m.enumerator_name, device_id: m.device_id});
    persist(); showCount(); showGps();
  };
}
function showCount(){
  const ml = $('metaLine');
  ml.textContent = meta.point_code + ' · ' + meta.weather + ' · ' + meta.enumerator_name + ' · ';
  const a = document.createElement('a');
  a.textContent = 'Change details'; a.href = '#'; a.style.color = '#2563eb';
  a.onclick = e => { e.preventDefault(); changeDetails(); };
  a.style.display = startTime ? 'none' : '';
  ml.appendChild(a);
  layout();
}
function changeDetails(){
  if (startTime) return;
  const w = meta ? meta.weather : '';
  meta = null; clearState();
  setupForm(); $('f_weather').value = w || '';
  layout();
}

/* ---------- counter ---------- */
function buildRows(){
  const rows = $('rows'); rows.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<div class="icon" title="' + cat + '">' + (ICONS[cat] || '') + '<span class="iname">' + LABELS[cat] + '</span></div>';
    DIRECTIONS.forEach(d => {
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = ARROWS[d]; b.setAttribute('aria-label', cat + ' ' + d);
      b.onclick = () => hit(cat, d);
      r.appendChild(b);
    });
    DIRECTIONS.forEach(d => {
      const s = document.createElement('div'); s.className = 'count'; s.id = cid(cat, d);
      s.textContent = counts[cat + '|' + d] || 0;
      r.appendChild(s);
    });
    rows.appendChild(r);
  });
}
function cid(c, d){ return 'c_' + c.replace(/\W/g,'') + '_' + d; }

function hit(cat, dir){
  if (startTime && elapsed() >= DURATION) return;
  if (!startTime){
    startTime = new Date().toISOString();
    /* Use the locked fix if one was set, otherwise live GPS */
    geo = lockedFix || lastFix;
    runTimer(); showGps();
    document.querySelectorAll('#metaLine a').forEach(l => l.style.display = 'none');
  }
  const k = cat + '|' + dir;
  counts[k] = (counts[k] || 0) + 1;
  events.push([new Date().toISOString(), cat, dir]);
  $(cid(cat, dir)).textContent = counts[k];
  if (navigator.vibrate) navigator.vibrate(15);
  persist();
}
function undo(){
  const last = events[events.length - 1];
  if (!last){ toast('Nothing to undo'); return; }
  if (!confirm('Are you sure you want to undo the last count (' + last[1] + ' – ' + last[2] + ')?')) return;
  const e = events.pop(), k = e[1] + '|' + e[2];
  counts[k] = Math.max((counts[k] || 0) - 1, 0);
  $(cid(e[1], e[2])).textContent = counts[k];
  toast('It has been undone: ' + e[1] + ' – ' + e[2]);
  persist();
}

/* ---------- 15-minute countdown ---------- */
function elapsed(){ return startTime ? Date.now() - new Date(startTime).getTime() : 0; }
function runTimer(){ clearInterval(tick); tick = setInterval(updTimer, 250); updTimer(); }
function updTimer(){
  const left = Math.max(DURATION - elapsed(), 0), s = Math.ceil(left / 1000);
  $('timer').textContent = pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s/60)%60) + ':' + pad(s%60);
  if (left <= 0 && startTime && !saving){
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    end();
  }
}
document.addEventListener('visibilitychange', () => { if (startTime) updTimer(); });

function end(){
  if (saving || !startTime) return;
  saving = true; clearInterval(tick);
  const no = nextNo();
  const rec = {uid: makeUid(), no, start: startTime,
               end: new Date(new Date(startTime).getTime() + DURATION).toISOString(),
               counts, events, geo: geo || lockedFix || lastFix, meta};
  sessions.push(rec); setJSON(NKEY, no + 1);
  const stored = saveSessions();
  clearState();
  overlay('🏁', 'Counting ended – 15 minutes complete');
  setTimeout(() => overlay('⏳', 'Saving on this phone…'), 1200);
  setTimeout(() => {
    if (stored) overlay('✅', 'Saved locally as ' + fileName(rec) + ' – open the Files tab to upload');
    else { overlay('⚠️', 'Could not store on this phone – downloading the file now'); downloadBlob(fileName(rec), toBlob(sessionWorkbook(rec))); }
  }, 1900);
  setTimeout(resetForNextSession, 3800);
}
function resetForNextSession(){
  counts = {}; events = []; startTime = null; geo = null; saving = false;
  /* Release the lock — the enumerator is expected to move to a new point */
  lockedFix = null;
  clearInterval(tick); clearState();
  $('timer').textContent = '00:15:00';
  $('overlay').style.display = 'none';
  buildRows(); window.scrollTo(0, 0); updateSaved();
  if (meta){ persist(); showCount(); } else layout();
  showGps();
  toast('Location unlocked – lock again at the next point');
}
function overlay(icon, text){ $('ovIcon').textContent = icon; $('ovText').textContent = text; $('overlay').style.display = 'flex'; }

/* ---------- Excel files ---------- */
function fmt(iso){ const d = new Date(iso); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function fileName(r){
  const d = new Date(r.start), pc = ((r.meta || {}).point_code || 'point').replace(/[^\w-]+/g, '_');
  return pc + '_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '_S' + r.no + '.xlsx';
}
function allName(){ const d = new Date(); return 'street_counts_all_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.xlsx'; }
function totalOf(r){ return Object.keys(r.counts || {}).reduce((a, k) => a + r.counts[k], 0); }
function cnt(r, c, d){ return (r.counts && r.counts[c + '|' + d]) || 0; }
function mapLink(g){ return g ? 'https://www.google.com/maps?q=' + g.lat + ',' + g.lng : ''; }
function sized(ws, w){ ws['!cols'] = w.map(x => ({wch: x})); return ws; }

function sessionWorkbook(r){
  const m = r.meta || {}, g = r.geo;
  const rows = [
    ['Session', r.no], ['Point code', m.point_code], ['Weather', m.weather], ['Enumerator', m.enumerator_name],
    ['Device ID', m.device_id], ['Start', fmt(r.start)], ['End', fmt(r.end)], ['Duration (min)', 15],
    ['GPS latitude', g ? g.lat : ''], ['GPS longitude', g ? g.lng : ''], ['GPS accuracy (m)', g ? g.acc : ''], ['Map', mapLink(g)], [],
    ['Category', 'Incoming', 'Outgoing', 'Total']
  ];
  let ti = 0, to = 0;
  CATEGORIES.forEach(c => { const i = cnt(r, c, 'Incoming'), o = cnt(r, c, 'Outgoing'); ti += i; to += o; rows.push([c, i, o, i + o]); });
  rows.push(['All categories', ti, to, ti + to]);
  const tap = [['Time', 'Category', 'Direction']].concat((r.events || []).map(e => [fmt(e[0]), e[1], e[2]]));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sized(XLSX.utils.aoa_to_sheet(rows), [20, 22, 12, 10]), 'Summary');
  XLSX.utils.book_append_sheet(wb, sized(XLSX.utils.aoa_to_sheet(tap), [20, 18, 12]), 'Tap log');
  return wb;
}
function allWorkbook(){
  const head = ['session','point_code','weather','enumerator_name','device_id','start','end','duration_min','gps_lat','gps_lon','gps_accuracy_m','map'];
  CATEGORIES.forEach(c => DIRECTIONS.forEach(d => head.push(c + ' – ' + d)));
  head.push('total');
  const rows = [head], tap = [['session','point_code','time','category','direction']];
  sessions.forEach(r => {
    const m = r.meta || {}, g = r.geo;
    const row = [r.no, m.point_code, m.weather, m.enumerator_name, m.device_id, fmt(r.start), fmt(r.end), 15, g ? g.lat : '', g ? g.lng : '', g ? g.acc : '', mapLink(g)];
    CATEGORIES.forEach(c => DIRECTIONS.forEach(d => row.push(cnt(r, c, d))));
    row.push(totalOf(r)); rows.push(row);
    (r.events || []).forEach(e => tap.push([r.no, m.point_code, fmt(e[0]), e[1], e[2]]));
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sized(XLSX.utils.aoa_to_sheet(rows), head.map(h => Math.max(h.length + 2, 12))), 'Sessions');
  XLSX.utils.book_append_sheet(wb, sized(XLSX.utils.aoa_to_sheet(tap), [9, 14, 20, 18, 12]), 'Tap log');
  return wb;
}
function toBlob(wb){ return new Blob([XLSX.write(wb, {bookType: 'xlsx', type: 'array'})], {type: XLSX_TYPE}); }

function downloadBlob(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- Files page ---------- */
function h(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function renderFiles(){
  const list = $('fileList'); list.innerHTML = '';
  const pending = sessions.filter(r => !isUploaded(r));
  const uploadedCount = sessions.length - pending.length;

  $('allBtns').classList.toggle('hide', !sessions.length);
  $('upBar').classList.toggle('hide', !CONFIG.uploadUrl || !sessions.length);
  $('upAll').classList.toggle('hide', !CONFIG.uploadUrl || !pending.length);
  $('selAll').checked = pending.length > 0 && pending.every(r => selected.has(r.uid));
  $('upBtn').disabled = selected.size === 0;
  $('upBtn').textContent = 'Upload selected' + (selected.size ? ' (' + selected.size + ')' : '');

  if (!sessions.length){
    list.appendChild(h('div', 'empty', 'No files yet. Each finished 15-minute count appears here as an Excel file.'));
    return;
  }

  const sum = h('div', 'fmeta',
    sessions.length + ' file' + (sessions.length > 1 ? 's' : '') +
    ' on this phone · ' + uploadedCount + ' uploaded · ' + pending.length + ' pending');
  sum.style.textAlign = 'center'; sum.style.marginBottom = '10px';
  list.appendChild(sum);

  sessions.slice().reverse().forEach(r => {
    const m = r.meta || {}, name = fileName(r), card = h('div', 'fcard'), head = h('div', 'fhead');
    const done = isUploaded(r);

    if (CONFIG.uploadUrl && !done){
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = selected.has(r.uid);
      cb.onchange = () => { if (cb.checked) selected.add(r.uid); else selected.delete(r.uid); renderFiles(); };
      head.appendChild(cb);
    }
    head.appendChild(h('div', 'fname', name)); card.appendChild(head);

    const metaDiv = h('div', 'fmeta', m.point_code + ' · ' + m.weather + ' · ' + m.enumerator_name + ' · ' + fmt(r.start) + ' · ' + totalOf(r) + ' counted');
    if (CONFIG.uploadUrl){
      metaDiv.appendChild(document.createElement('br'));
      metaDiv.appendChild(done
        ? h('span', 'st-ok', '✓ Uploaded' + (r.uploadedAt ? ' ' + fmt(r.uploadedAt) : ''))
        : h('span', 'st-no', 'Not uploaded yet'));
    }
    card.appendChild(metaDiv);

    const b = h('div', 'fbtns');
    const dl = h('button', 'b-dl', 'Download');
    const del = h('button', 'b-del', 'Delete');
    dl.onclick = () => downloadBlob(name, toBlob(sessionWorkbook(r)));

    const up = h('button', 'b-up', done ? 'Uploaded ✓' : 'Upload');
    if (done){ up.disabled = true; } else up.onclick = () => uploadRecs([r]);

    del.onclick = () => {
      const warn = (CONFIG.uploadUrl && !done) ? ' It has NOT been uploaded yet.' : '';
      if (!confirm('Delete ' + name + ' from this phone?' + warn + ' This cannot be undone.')) return;
      sessions = sessions.filter(x => x.uid !== r.uid); selected.delete(r.uid); saveSessions(); renderFiles(); toast('File deleted');
    };
    if (CONFIG.uploadUrl) b.append(dl, up, del); else b.append(dl, del);
    card.appendChild(b); list.appendChild(card);
  });
}

/* ============================================================
   UPLOAD — pushes the session(s) to CONFIG.uploadUrl
   ============================================================ */
function postBatch(batch){
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => ctrl && ctrl.abort(), 30000);
  const body = JSON.stringify({
    key: CONFIG.apiKey,
    sessions: batch.map(r => ({
      uid: r.uid, no: r.no, start: r.start, end: r.end,
      counts: r.counts, geo: r.geo, meta: r.meta,
      events: CONFIG.uploadTapLog ? r.events : []
    }))
  });
  return fetch(CONFIG.uploadUrl, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body,
      signal: ctrl ? ctrl.signal : undefined
    })
    .then(r => r.json())
    .then(j => {
      if (!j || j.ok === false) return null;
      return { saved: j.saved || [], duplicates: j.duplicates || [] };
    })
    .catch(() => null)
    .then(res => { clearTimeout(timer); return res; });
}

let uploading = false;
function uploadSelected(){
  const recs = sessions.filter(r => selected.has(r.uid) && !isUploaded(r));
  if (!recs.length){ toast('Tick at least one file'); return; }
  uploadRecs(recs);
}

async function uploadRecs(recs){
  if (uploading || !recs.length) return;
  if (!CONFIG.uploadUrl){ toast('Upload URL is not configured'); return; }
  if (!navigator.onLine){ toast('No internet – connect and try again'); return; }

  const fresh = recs.filter(r => !isUploaded(r));
  const alreadyCount = recs.length - fresh.length;

  if (!fresh.length){
    overlay('ℹ️', alreadyCount + ' file' + (alreadyCount > 1 ? 's were' : ' was') +
                   ' already uploaded – skipped to avoid duplicates');
    setTimeout(() => { $('overlay').style.display = 'none'; renderFiles(); }, 2200);
    return;
  }

  uploading = true;
  overlay('⏳', 'Uploading ' + fresh.length + ' file' + (fresh.length > 1 ? 's' : '') + '…');

  let ok = 0, fail = 0, dup = alreadyCount;

  for (let i = 0; i < fresh.length; i += 5){
    const batch = fresh.slice(i, i + 5);
    const res = await postBatch(batch);
    if (res){
      batch.forEach(r => {
        if (res.saved.indexOf(r.uid) >= 0){
          r.uploaded = true;
          r.uploadedAt = new Date().toISOString();
          uploadedUids.add(r.uid);
          selected.delete(r.uid);
          ok++;
        } else if (res.duplicates.indexOf(r.uid) >= 0){
          r.uploaded = true;
          r.uploadedAt = r.uploadedAt || new Date().toISOString();
          uploadedUids.add(r.uid);
          selected.delete(r.uid);
          dup++;
        } else {
          fail++;
        }
      });
      saveSessions();
      saveUploadedUids();
    } else {
      fail += batch.length;
    }
  }
  uploading = false;

  let msg = ok + ' uploaded';
  if (dup)  msg += ', ' + dup  + ' already uploaded (skipped)';
  if (fail) msg += ', ' + fail + ' failed';

  if (fail){
    overlay('⚠️', msg + '. Check your connection and tap Upload again.');
  } else if (ok === 0 && dup > 0){
    overlay('ℹ️', 'All ' + dup + ' file' + (dup > 1 ? 's were' : ' was') +
                   ' already uploaded – no duplicates created');
  } else {
    overlay('✅', msg + ' to Google Sheets');
  }

  setTimeout(() => { $('overlay').style.display = 'none'; renderFiles(); }, 2400);
}

/* ============================================================
   GPS + LOCK LOCATION (per-count, in-memory only)
   ============================================================ */
function startGps(){
  if (!navigator.geolocation){ setGps('Location not supported', 'bad'); showGps(); return; }
  navigator.geolocation.watchPosition(pos => {
    const f = {lat: pos.coords.latitude, lng: pos.coords.longitude,
               acc: Math.round(pos.coords.accuracy), time: new Date().toISOString()};
    lastFix = f;
    /* Only keep updating the session's geo if nothing is locked */
    if (!lockedFix && startTime && (!geo || f.acc <= geo.acc)){ geo = f; persist(); }
    showGps();
  }, err => {
    setGps(err.code === 1 ? 'Location blocked – allow it in browser settings' : 'No GPS signal yet…', 'bad');
    showGps();
  }, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});
}

/* Toggle the lock. Locked = the current best fix is frozen for this count.
   Unlocked = GPS keeps updating normally. The lock is released automatically
   when the count finishes. */
function toggleLock(){
  if (lockedFix){
    lockedFix = null;
    if (!startTime) geo = null;
    persist(); showGps();
    toast('Location unlocked');
    return;
  }
  const candidates = [lastFix, geo].filter(Boolean);
  if (!candidates.length){ toast('No GPS fix yet – wait for a location'); return; }
  candidates.sort((a,b) => a.acc - b.acc);
  const f = candidates[0];
  lockedFix = f;
  geo = f;
  persist(); showGps();
  if (f.acc <= RECOMMENDED_ACC){
    toast('📍 Location locked for this count (±' + f.acc + ' m) ✓');
  } else {
    toast('📍 Locked at ±' + f.acc + ' m – recommended ≤ ' + RECOMMENDED_ACC + ' m');
  }
}

function showGps(){
  const btn = $('lockBtn');
  if (!btn) return;

  if (lockedFix){
    const f = lockedFix;
    const good = f.acc <= RECOMMENDED_ACC;
    setGps('🔒 Locked for this count · ±' + f.acc + ' m' + (good ? ' ✓' : ' (recommended ≤ ' + RECOMMENDED_ACC + ' m)'),
           good ? 'ok' : 'bad');
    btn.textContent = 'Unlock location';
    btn.classList.add('locked');
    btn.classList.toggle('warn', !good);
    return;
  }

  const f = lastFix;
  btn.textContent = 'Lock location';
  btn.classList.remove('locked');

  if (!f){
    setGps('📍 Locating…');
    btn.classList.remove('warn');
    return;
  }

  const good = f.acc <= RECOMMENDED_ACC;
  setGps('📍 GPS ±' + f.acc + ' m' + (good ? ' ✓ ready to lock' : ' – move to open sky for ≤ ' + RECOMMENDED_ACC + ' m'),
         good ? 'ok' : 'bad');
  btn.classList.toggle('warn', !good);
}

function setGps(t, cls){
  const gt = $('gpsText'); if (gt) gt.textContent = t;
  const g  = $('gps');
  if (g) g.className = cls || '';
}
function toast(m){ const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3000); }
</script>
